      /* ============================================================
         VANHSYA DESIGN REFINEMENT LAYER
         Refined cards, containers, animated tables, cinemagraphs
         ============================================================ */

      :root {
        --ease-silk: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-snap: cubic-bezier(0.34, 1.56, 0.64, 1);
        --surface-raised: rgba(255, 255, 255, 0.04);
        --surface-hover: rgba(255, 255, 255, 0.07);
        --ring-glow: 0 0 0 1px rgba(138, 43, 226, 0.35), 0 18px 60px -18px rgba(138, 43, 226, 0.45);
      }
      html[data-theme='light'] {
        --surface-raised: rgba(15, 23, 42, 0.03);
        --surface-hover: rgba(15, 23, 42, 0.06);
        --ring-glow: 0 0 0 1px rgba(99, 102, 241, 0.28), 0 18px 60px -20px rgba(99, 102, 241, 0.35);
      }

      /* Refined outer containers with soft gradient hairline border */
      .surface-refined {
        position: relative;
        background: var(--surface-raised);
        border: 1px solid var(--border-color);
        border-radius: 1.5rem;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        transition: transform 0.45s var(--ease-silk), box-shadow 0.45s var(--ease-silk), border-color 0.45s var(--ease-silk);
      }
      .surface-refined::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(135deg, rgba(0, 242, 254, 0.35), transparent 40%, transparent 60%, rgba(138, 43, 226, 0.35));
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0;
        transition: opacity 0.45s var(--ease-silk);
        pointer-events: none;
      }
      .surface-refined:hover {
        transform: translateY(-4px);
        box-shadow: var(--ring-glow);
        border-color: transparent;
      }
      .surface-refined:hover::after { opacity: 1; }

      /* Card lift refinement shared across tour/meetup/offer */
      .tour-card, .meetup-card, .offer-card {
        will-change: transform;
      }
      .tour-card:focus-within, .meetup-card:focus-within, .offer-card:focus-within {
        box-shadow: var(--ring-glow);
      }

      /* ---------- SOPHISTICATED TABLE ANIMATIONS ---------- */
      .table-shell {
        position: relative;
        border-radius: 1.25rem;
        overflow: hidden;
        border: 1px solid var(--border-color);
        background: var(--surface-raised);
      }
      .table-shell::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.06) 48%, transparent 62%);
        transform: translateX(-100%);
        animation: table-sheen 7s var(--ease-silk) infinite;
        pointer-events: none;
        z-index: 3;
      }
      @keyframes table-sheen {
        0%, 62% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      table { border-collapse: separate; border-spacing: 0; width: 100%; }
      thead th {
        position: sticky;
        top: 0;
        z-index: 2;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        background: color-mix(in srgb, var(--bg-secondary) 82%, transparent);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.68rem;
        font-weight: 800;
        color: var(--text-secondary);
        padding: 0.9rem 1rem;
        border-bottom: 1px solid var(--border-color);
        opacity: 0;
        transform: translateY(-8px);
        animation: th-drop 0.55s var(--ease-silk) forwards;
      }
      thead th:nth-child(1) { animation-delay: 0.05s; }
      thead th:nth-child(2) { animation-delay: 0.11s; }
      thead th:nth-child(3) { animation-delay: 0.17s; }
      thead th:nth-child(4) { animation-delay: 0.23s; }
      thead th:nth-child(5) { animation-delay: 0.29s; }
      @keyframes th-drop { to { opacity: 1; transform: translateY(0); } }

      tbody tr {
        opacity: 0;
        transform: translateY(14px);
        animation: row-rise 0.6s var(--ease-silk) forwards;
        transition: background-color 0.25s var(--ease-silk), box-shadow 0.25s var(--ease-silk);
      }
      tbody tr:nth-child(1) { animation-delay: 0.12s; }
      tbody tr:nth-child(2) { animation-delay: 0.18s; }
      tbody tr:nth-child(3) { animation-delay: 0.24s; }
      tbody tr:nth-child(4) { animation-delay: 0.30s; }
      tbody tr:nth-child(5) { animation-delay: 0.36s; }
      tbody tr:nth-child(6) { animation-delay: 0.42s; }
      tbody tr:nth-child(7) { animation-delay: 0.48s; }
      tbody tr:nth-child(8) { animation-delay: 0.54s; }
      tbody tr:nth-child(n+9) { animation-delay: 0.6s; }
      @keyframes row-rise { to { opacity: 1; transform: translateY(0); } }
      tbody td {
        padding: 0.85rem 1rem;
        border-bottom: 1px solid color-mix(in srgb, var(--border-color) 70%, transparent);
        font-size: 0.85rem;
      }
      tbody tr:hover {
        background-color: rgba(138, 43, 226, 0.08);
        box-shadow: inset 3px 0 0 var(--accent-secondary);
      }
      html[data-theme='light'] tbody tr:hover { background-color: rgba(99, 102, 241, 0.08); }

      /* Generic staggered row reveal for div-based data lists */
      .row-reveal { opacity: 0; transform: translateY(14px); animation: row-rise 0.6s var(--ease-silk) forwards; }
      .row-reveal:nth-child(1) { animation-delay: 0.05s; }
      .row-reveal:nth-child(2) { animation-delay: 0.1s; }
      .row-reveal:nth-child(3) { animation-delay: 0.15s; }
      .row-reveal:nth-child(4) { animation-delay: 0.2s; }
      .row-reveal:nth-child(5) { animation-delay: 0.25s; }
      .row-reveal:nth-child(n+6) { animation-delay: 0.3s; }

      /* ---------- CINEMAGRAPH / LIVING IMAGERY ---------- */
      .cinemagraph {
        position: relative;
        overflow: hidden;
        isolation: isolate;
      }
      .cinemagraph img, .cinemagraph video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.08);
        animation: cinemagraph-drift 18s ease-in-out infinite alternate;
        will-change: transform;
      }
      .cinemagraph--slow img { animation-duration: 26s; }
      .cinemagraph--reverse img { animation-direction: alternate-reverse; }
      /* Light sweep simulating a living highlight passing over the scene */
      .cinemagraph::after {
        content: '';
        position: absolute;
        inset: -40% -120%;
        background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,0.12) 50%, transparent 58%);
        animation: cinemagraph-sheen 9s ease-in-out infinite;
        pointer-events: none;
        z-index: 2;
        mix-blend-mode: screen;
      }
      /* Subtle breathing vignette for depth */
      .cinemagraph::before {
        content: '';
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 120px 20px rgba(0,0,0,0.35);
        animation: cinemagraph-breathe 11s ease-in-out infinite;
        pointer-events: none;
        z-index: 1;
      }
      @keyframes cinemagraph-drift {
